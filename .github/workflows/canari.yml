name: Europarl canari WAF

# Test : le WAF AWS d'europarl.europa.eu tolere-t-il des requetes lentes
# depuis les IP Azure de GitHub Actions ?
# Se declenche a chaque push (boucle de developpement) + cron quotidien.
# Le script publie sa sortie et ses diagnostics dans une issue du repo,
# lisible a distance. Echec du job uniquement si 0 % de HTTP 200.

on:
  push:
    paths:
      - "pe_canari.py"
      - ".github/workflows/canari.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      limite:
        description: "Nombre de MPE a tester (max 84)"
        required: false
        default: "84"

concurrency:
  group: europarl-canari
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  canari:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test WAF
        id: test
        env:
          LIMITE: ${{ inputs.limite || '84' }}
        run: python pe_canari.py 2>&1 | tee sortie.txt
        continue-on-error: true

      - name: Bilan dans une issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Run canari #${{ github.run_number }}"
        run: |
          {
            echo "## Run #${{ github.run_number }}"
            echo ""
            echo "- Etat du job : ${{ steps.test.outcome }}"
            echo "- Commit : ${{ github.sha }}"
            echo "- Lien run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo '<details><summary>Sortie du script</summary>'
            echo ""
            echo '~~~'
            cat sortie.txt
            echo '~~~'
            echo "</details>"
            echo ""
            if [ -f diag.txt ]; then
              echo '<details><summary>Diagnostic API (extrait du corps recu)</summary>'
              echo ""
              echo '~~~xml'
              cat diag.txt
              echo '~~~'
              echo "</details>"
            fi
          } > corps_issue.md
          gh issue create --title "$ISSUE_TITLE" --body-file corps_issue.md || \
            gh issue comment "$(gh issue list --limit 1 --json number --jq '.[0].number')" --body-file corps_issue.md
